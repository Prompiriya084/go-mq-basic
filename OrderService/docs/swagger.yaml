basePath: /
definitions:
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  models.Order:
    properties:
      product_id:
        type: string
      qty:
        type: integer
    required:
    - product_id
    - qty
    type: object
info:
  contact: {}
  description: API Example
  title: Order Service API
  version: "1.0"
paths:
  /api/orders:
    get:
      consumes:
      - application/json
      description: Get all orders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Order'
            type: array
      summary: Get all orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create a new order
      parameters:
      - description: Order info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Order'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create order
      tags:
      - Orders
schemes:
- http
swagger: "2.0"
